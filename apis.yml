aid: lina
name: Lina
description: Lina is a medical coworking company providing space, community, and support for independent
  healthcare practitioners in private practice. Founded by Vicrum Puri and Rachel Puri, Lina offers
  turnkey private office suites alongside on-demand medical, therapy, and bodywork spaces that are
  HIPAA and OSHA compliant and bookable by the hour or by the day. Locations operate in NoMad and
  Grand Central in New York City and Aventura, Florida, with expansion announced for Washington DC,
  West Palm Beach, the Upper West Side, and Brooklyn. Lina is a Bloomberg Beta portfolio company.
  It operates a Webflow marketing site and publishes no public API, developer portal, or machine-readable
  interface as of this enrichment pass.
